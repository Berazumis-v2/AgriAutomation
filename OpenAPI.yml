openapi: 3.0.0
info:
  title: AgriAutomation API
  description: API for AgriAutomation
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /plantcaresystems:
    get:
      summary: Get a list of plant care systems
      tags:
        - Plant Care System
      operationId: getAllPlantCareSystems
      responses:
        '200':
          description: A list of plant care systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantCareSystemResponse'
    post:
      summary: Create a new plant care system
      tags:
        - Plant Care System
      operationId: createPlantCareSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCareSystemRequest'
            example:
              name: "Greenhouse System"
              description: "Automated greenhouse system"
              automationEnabled: true
              maintenanceTimeStamp: "2023-10-01T12:00:00Z"
      responses:
        '201':
          description: Plant care system created successfully
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /plantcaresystems/{plantCareSystemId}:
    parameters:
      - $ref: '#/components/parameters/plantCareSystemId'
    get:
      summary: Get a plant care system by ID
      tags:
        - Plant Care System
      operationId: getPlantCareSystemById
      responses:
        '200':
          description: A single plant care system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantCareSystemResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a plant care system by ID
      tags:
        - Plant Care System
      operationId: updatePlantCareSystemById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCareSystemRequest'
            example:
              name: "Updated System Name"
              description: "Updated description"
              automationEnabled: false
              maintenanceTimeStamp: "2023-11-01T12:00:00Z"
      responses:
        '200':
          description: Updated plant care system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantCareSystemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a plant care system by ID
      tags:
        - Plant Care System
      operationId: deletePlantCareSystemById
      responses:
        '204':
          description: Plant care system deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /plantcaresystems/{plantCareSystemId}/sensors:
    parameters:
      - $ref: '#/components/parameters/plantCareSystemId'
    get:
      summary: Get sensors for a plant care system
      tags:
        - Sensor
      operationId: getSensorsByPlantCareSystemId
      responses:
        '200':
          description: List of sensors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a sensor to a plant care system
      tags:
        - Sensor
      operationId: createSensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorRequest'
            example:
              model: "SensorModelX"
              temperature: 25
              humidity: 60
              readingTimestamp: "2023-10-05T14:30:00Z"
              calibrationTimestamp: "2023-10-01T12:00:00Z"
      responses:
        '201':
          description: Sensor created successfully
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /plantcaresystems/{plantCareSystemId}/sensors/{sensorId}:
    parameters:
      - $ref: '#/components/parameters/plantCareSystemId'
      - $ref: '#/components/parameters/sensorId'
    get:
      summary: Get a specific sensor by ID
      tags:
        - Sensor
      operationId: getSensorById
      responses:
        '200':
          description: A single sensor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a sensor by ID
      tags:
        - Sensor
      operationId: updateSensorById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorRequest'
            example:
              model: "UpdatedModelY"
              temperature: 22
              humidity: 55
              readingTimestamp: "2023-11-05T14:30:00Z"
              calibrationTimestamp: "2023-11-01T12:00:00Z"
      responses:
        '200':
          description: Updated sensor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a sensor by ID
      tags:
        - Sensor
      operationId: deleteSensorById
      responses:
        '204':
          description: Sensor deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /plantcaresystems/{plantCareSystemId}/sensors/{sensorId}/plants:
    parameters:
      - $ref: '#/components/parameters/plantCareSystemId'
      - $ref: '#/components/parameters/sensorId'
    get:
      summary: Get plants for a specific sensor
      tags:
        - Plant
      operationId: getPlantsBySensorId
      responses:
        '200':
          description: List of plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a plant to a sensor
      tags:
        - Plant
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantRequest'
            example:
              name: "Tomato"
              growthStage: "Seedling"
      responses:
        '201':
          description: Plant created successfully
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /plantcaresystems/{plantCareSystemId}/sensors/{sensorId}/plants/{plantId}:
    parameters:
      - $ref: '#/components/parameters/plantCareSystemId'
      - $ref: '#/components/parameters/sensorId'
      - $ref: '#/components/parameters/plantId'
    get:
      summary: Get a specific plant by ID
      tags:
        - Plant
      operationId: getPlantById
      responses:
        '200':
          description: A single plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a plant by ID
      tags:
        - Plant
      operationId: updatePlantById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantRequest'
            example:
              name: "Updated Tomato"
              growthStage: "Vegetative"
      responses:
        '200':
          description: Updated plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a plant by ID
      tags:
        - Plant
      operationId: deletePlantById
      responses:
        '204':
          description: Plant deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    PlantCareSystemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the plant care system
        description:
          type: string
          description: Description of the plant care system
        automationEnabled:
          type: boolean
          description: Automation status
        maintenanceTimeStamp:
          type: string
          format: date-time
          description: Last maintenance timestamp
    PlantCareSystemResponse:
      allOf:
        - $ref: '#/components/schemas/PlantCareSystemRequest'
        - type: object
          properties:
            id:
              type: int
              description: Unique identifier
    SensorRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
          description: Sensor model
        temperature:
          type: int
          description: Current temperature reading
        humidity:
          type: int
          description: Current humidity reading
        readingTimestamp:
          type: string
          format: date-time
          description: Timestamp of the reading
        calibrationTimestamp:
          type: string
          format: date-time
          description: Last calibration timestamp
    SensorResponse:
      allOf:
        - $ref: '#/components/schemas/SensorRequest'
        - type: object
          properties:
            id:
              type: int
              description: Unique identifier
    PlantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the plant
        growthStage:
          type: string
          description: Growth stage of the plant (e.g., Seedling, Vegetative, Flowering)
    PlantResponse:
      allOf:
        - $ref: '#/components/schemas/PlantRequest'
        - type: object
          properties:
            id:
              type: int
              description: Unique identifier
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        resource:
          type: string
          description: Resource where the error occurred
        field:
          type: string
          description: Field where the error occurred
        code:
          type: string
          description: Error code

  parameters:
    plantCareSystemId:
      name: plantCareSystemId
      in: path
      required: true
      schema:
        type: int
        minimum: 1
      description: The unique identifier of the plant care system
    sensorId:
      name: sensorId
      in: path
      required: true
      schema:
        type: int
        minimum: 1
      description: The unique identifier of the sensor
    plantId:
      name: plantId
      in: path
      required: true
      schema:
        type: int
        minimum: 1
      description: The unique identifier of the plant

  responses:
    BadRequest:
      description: Bad request due to invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Invalid request data"
            details:
              - resource: "PlantCareSystem"
                field: "name"
                code: "must not be blank"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "PlantCareSystem not found with id 1"
            details:
              - resource: "PlantCareSystem"
                field: "id"
                code: "not_found"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Validation Failed"
            details:
              - resource: "PlantCareSystem"
                field: "name"
                code: "size must be between 2 and 100"

tags:
  - name: Plant Care System
    description: Operations related to plant care systems
  - name: Sensor
    description: Operations related to sensors
  - name: Plant
    description: Operations related to plants
